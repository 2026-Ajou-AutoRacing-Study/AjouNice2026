# Generated candidate-only ROS1 parameter tree; load beneath the owning node namespace.
icc_parameters:
  enable: true
  detection_range: 50.0
  ttc_threshold: 1.0
  ego_deceleration: 1.0
  min_time_horizon: 10.0
  on_time_buffer: 0.5
  off_time_buffer: 1.0
  close_distance_th: 3.0
  close_time_th: 3.0
  right_turn:
    enable: true
    check_traffic_signal: true
    check_crossing_lanes: true
    check_turning_lanes: true
    crossing_lane_angle_th: 0.785398
  left_turn:
    enable: true
    check_traffic_signal: true
    check_turning_lanes: true
  pointcloud:
    height_buffer: 0.5
    min_height: 0.5
    voxel_grid_filter:
      x: 0.2
      y: 0.2
      z: 0.2
      min_size: 3
    clustering:
      tolerance: 0.5
      min_height: 0.5
      min_size: 10
      max_size: 10000
    velocity_estimation:
      max_acceleration: 20.0
      max_velocity: 25.0
      observation_time: 0.3
      max_history_time: 0.5
      buffer_size: 10
    latency: 0.3
  filter:
    min_velocity: 1.0
    moving_time: 0.5
