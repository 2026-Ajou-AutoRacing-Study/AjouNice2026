# ROS1 private-node rendering of the frozen ROS2 rear_collision_checker.param.yaml.
# Values are intentionally retained; the ROS2 /**/ros__parameters wrapper is
# replaced with the namespace consumed by rosparam and the R003 plugin.
common:
  on_time_buffer: 0.5
  off_time_buffer: 1.5
  check_on_unstoppable: false
  pointcloud:
    range: {dead_zone: 0.3, buffer: 1.0}
    crop_box_filter:
      x: {max: 30.0, min: -100.0}
      z: {max: -1.0, min: 0.3}
    voxel_grid_filter: {x: 0.1, y: 0.1, z: 0.5}
    clustering:
      cluster_tolerance: 0.15
      min_cluster_height: 0.1
      min_cluster_size: 5
      max_cluster_size: 10000
    velocity_estimation: {observation_time: 0.3, max_acceleration: 10.0}
    latency: 0.3
  filter: {min_velocity: 1.0, moving_time: 0.5}
  time_to_collision: {margin: 2.0}
  ego:
    reaction_time: 1.2
    min_velocity: 1.38
    max_velocity: 16.6
    max_acceleration: 1.5
    max_deceleration: -4.0
    max_positive_jerk: 5.0
    max_negative_jerk: -5.0
    nominal_deceleration: -1.5
    nominal_positive_jerk: 0.6
    nominal_negative_jerk: -0.6
  blind_spot:
    lookahead_time: 4.0
    metric: ttc
    check: {front: false, left: true, right: false, yaw_th: 0.78}
    offset: {inner: 0.1, outer: 0.3}
    participants: {reaction_time: 1.2, max_velocity: 5.5, max_deceleration: -2.0}
  adjacent_lane:
    lookahead_time: 4.0
    metric: rss
    check: {front: true}
    offset: {left: -0.5, right: -0.5}
    participants: {reaction_time: 1.2, max_velocity: 16.6, max_deceleration: -2.0}
