resample:
  ds_resample: 0.1
  num_resample: 1
  delta_yaw_threshold: 0.785

latacc:
  enable_constant_velocity_while_turning: false
  constant_velocity_dist_threshold: 2.0

forward:
  # Keep these motion bounds synchronized with the active shared normal limits
  # (autoware_launch/config/ros1/planning/scenario_planning/common/common.param.yaml).
  # BVP/MVP preview must not assume the old mild braking while execution brakes
  # faster for a curve. This changes no collision margin, lateral cap or stop rule.
  max_acc: 3.7
  min_acc: -6.0
  max_jerk: 100.0
  min_jerk: -20.0
  kp: 0.3

backward:
  start_jerk: -0.1
  min_jerk_mild_stop: -0.3
  min_jerk: -1.5
  min_acc_mild_stop: -1.0
  min_acc: -2.5
  span_jerk: -0.01
