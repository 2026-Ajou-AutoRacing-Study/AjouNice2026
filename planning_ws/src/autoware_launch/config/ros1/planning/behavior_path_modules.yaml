lane_change:
  # R42 simulator: shared native generation + bounded admission search budget (ms).
  time_limit: 100.0
  backward_lane_length: 200.0
  backward_length_buffer_for_end_of_lane: 3.0
  backward_length_buffer_for_blocking_object: 3.0
  backward_length_from_intersection: 5.0
  enable_stopped_vehicle_buffer: true
  min_length_for_turn_signal_activation: 10.0
  terminal_path:
    enable: true
    disable_near_goal: true
    stop_at_boundary: false
  trajectory:
    # Immediate LC remains allowed; look ahead to legally starting merge lanes.
    max_prepare_duration: 3.0
    min_prepare_duration: 0.0
    lateral_jerk: 5.0
    # Ordinary LC candidates: avoid choosing emergency-strength braking to merge.
    # Obstacle stop/cruise braking and full RSS collision checks remain separate.
    min_longitudinal_acc: -4.0
    # Positive candidates remain capped by the calibrated speed/acceleration map.
    max_longitudinal_acc: 3.7
    th_prepare_length_diff: 1.0
    th_lane_changing_length_diff: 1.0
    min_lane_changing_velocity: 2.78
    lon_acc_sampling_num: 20
    lat_acc_sampling_num: 11
    lane_changing_decel_factor: 0.5
    th_prepare_curvature: 0.03
  delay_lane_change:
    enable: true
    check_only_parked_vehicle: false
    min_road_shoulder_width: 0.5
    th_parked_vehicle_shift_ratio: 0.6
  frenet:
    enable: true
    use_entire_remaining_distance: false
    th_yaw_diff: 10.0
    th_curvature_smoothing: 0.1
    th_average_curvature: 0.02
  safety_check:
    allow_loose_check_for_cancel: true
    enable_target_lane_bound_check: true
    stopped_object_velocity_threshold: 0.3
    prepare:
      expected_front_deceleration: -6.0
      expected_rear_deceleration: -6.0
      rear_vehicle_reaction_time: 0.5
      rear_vehicle_safety_time_margin: 0.0
      lateral_distance_max_threshold: 0.5
      longitudinal_distance_min_threshold: 1.0
      longitudinal_velocity_delta_time: 0.0
      extended_polygon_policy: along_path
    execution:
      expected_front_deceleration: -6.0
      expected_rear_deceleration: -6.0
      rear_vehicle_reaction_time: 0.5
      rear_vehicle_safety_time_margin: 0.0
      lateral_distance_max_threshold: 0.5
      longitudinal_distance_min_threshold: 3.0
      longitudinal_velocity_delta_time: 0.0
      # Follow the actual LC path; physical overlap and RSS margins remain binding.
      extended_polygon_policy: along_path
    parked:
      expected_front_deceleration: -1.0
      expected_rear_deceleration: -2.0
      rear_vehicle_reaction_time: 1.0
      rear_vehicle_safety_time_margin: 0.8
      lateral_distance_max_threshold: 1.0
      longitudinal_distance_min_threshold: 3.0
      longitudinal_velocity_delta_time: 0.0
      extended_polygon_policy: rectangle
    cancel:
      # R18 simulator experiment: same emergency RSS assumptions as execution.
      # Strict final/abort checks remain enabled; not a calibrated vehicle claim.
      expected_front_deceleration: -6.0
      expected_rear_deceleration: -6.0
      rear_vehicle_reaction_time: 0.5
      rear_vehicle_safety_time_margin: 0.0
      lateral_distance_max_threshold: 0.5
      longitudinal_distance_min_threshold: 3.0
      longitudinal_velocity_delta_time: 0.0
      extended_polygon_policy: along_path
    stuck:
      expected_front_deceleration: -1.0
      expected_rear_deceleration: -1.0
      rear_vehicle_reaction_time: 2.0
      rear_vehicle_safety_time_margin: 1.0
      lateral_distance_max_threshold: 2.0
      longitudinal_distance_min_threshold: 3.0
      longitudinal_velocity_delta_time: 0.0
      extended_polygon_policy: rectangle
    lane_expansion:
      left_offset: 1.0
      right_offset: 1.0
  lateral_acceleration:
    velocity:
    - 0.0
    - 4.0
    - 10.0
    min_values:
    - 1.0
    - 1.0
    - 1.0
    max_values:
    - 4.5
    - 4.5
    - 4.5
  target_object:
    car: true
    truck: true
    bus: true
    trailer: true
    unknown: false
    bicycle: true
    motorcycle: true
    pedestrian: true
  collision_check:
    prediction_time_resolution: 0.5
    th_incoming_object_yaw: 2.3562
    yaw_diff_threshold: 3.1416
    check_current_lanes: true
    check_other_lanes: true
