plugins_path: $(find-pkg-share autoware_tensorrt_plugins)/plugins/libautoware_tensorrt_plugins.so
onnx_model_path: $(var data_path)/diffusion_planner/v4.0/diffusion_planner.onnx
args_path: $(var data_path)/diffusion_planner/v4.0/diffusion_planner.param.json
planning_frequency_hz: 10.0
ignore_neighbors: false
ignore_unknown_neighbors: true
traffic_light_group_msg_timeout_seconds: 0.2
batch_size: 1
temperature:
- 0.0
velocity_smoothing_window: 8
stopping_threshold: 0.3
turn_indicator_keep_offset: -1.25
turn_indicator_hold_duration: 1.0
shift_x: false
delay_step: 0
line_string_max_step_m: 5.0
use_time_interpolation: false
planning_factor/enable_stop: true
planning_factor/enable_slowdown: false
planning_factor/stop_keep_duration_threshold: 1.0
planning_factor/stop_velocity_threshold: 0.1
planning_factor/slowdown_accel_threshold: -0.3
debug_params/publish_debug_route: true
debug_params/publish_debug_map: false
debug_params/publish_debug_linestrings: true
