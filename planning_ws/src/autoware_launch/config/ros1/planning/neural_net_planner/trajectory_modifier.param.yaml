plugin_names:
- autoware::trajectory_modifier::plugin::ObstacleStop
- autoware::trajectory_modifier::plugin::StopPointFixer
use_stop_point_fixer: true
use_obstacle_stop: true
trajectory_time_step: 0.1
stop_point_fixer/force_stop_long_stopped_trajectories: true
stop_point_fixer/force_stop_close_stopped_trajectories: true
stop_point_fixer/velocity_threshold: 0.25
stop_point_fixer/min_distance_threshold: 1.0
stop_point_fixer/min_stop_duration: 0.5
obstacle_stop/use_objects: true
obstacle_stop/use_pointcloud: true
obstacle_stop/enable_stop_for_objects: true
obstacle_stop/enable_stop_for_pointcloud: false
obstacle_stop/stop_margin: 6.0
obstacle_stop/nominal_stopping_decel: 1.0
obstacle_stop/maximum_stopping_decel: 4.0
obstacle_stop/stopping_jerk: 3.0
obstacle_stop/lateral_margin: 0.0
obstacle_stop/arrived_distance_threshold: 0.5
obstacle_stop/obstacle_tracking/on_time_buffer: 0.5
obstacle_stop/obstacle_tracking/off_time_buffer: 1.0
obstacle_stop/obstacle_tracking/object_distance_th: 1.0
obstacle_stop/obstacle_tracking/object_yaw_th: 0.1745
obstacle_stop/obstacle_tracking/pcd_distance_th: 0.5
obstacle_stop/obstacle_tracking/grace_period: 0.2
obstacle_stop/objects/object_types:
- car
- truck
- bus
- trailer
- motorcycle
- bicycle
- pedestrian
obstacle_stop/objects/max_velocity_th: 1.0
obstacle_stop/pointcloud/height_buffer: 0.5
obstacle_stop/pointcloud/min_height: 0.2
obstacle_stop/pointcloud/voxel_grid_filter/x: 0.2
obstacle_stop/pointcloud/voxel_grid_filter/y: 0.2
obstacle_stop/pointcloud/voxel_grid_filter/z: 0.2
obstacle_stop/pointcloud/voxel_grid_filter/min_size: 3
obstacle_stop/pointcloud/clustering/tolerance: 0.5
obstacle_stop/pointcloud/clustering/min_height: 0.5
obstacle_stop/pointcloud/clustering/min_size: 10
obstacle_stop/pointcloud/clustering/max_size: 10000
obstacle_stop/rss_params/enable: true
obstacle_stop/rss_params/object_decel/car: 1.5
obstacle_stop/rss_params/object_decel/truck: 1.5
obstacle_stop/rss_params/object_decel/bus: 1.5
obstacle_stop/rss_params/object_decel/trailer: 1.5
obstacle_stop/rss_params/object_decel/motorcycle: 3.0
obstacle_stop/rss_params/object_decel/bicycle: 5.0
obstacle_stop/rss_params/object_decel/pedestrian: 5.0
obstacle_stop/rss_params/reaction_time: 0.2
obstacle_stop/rss_params/safety_margin: 2.0
obstacle_stop/rss_params/min_vel_th: 0.5
