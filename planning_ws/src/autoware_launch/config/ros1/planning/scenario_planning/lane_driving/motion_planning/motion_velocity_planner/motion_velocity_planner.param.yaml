pointcloud_preprocessing/filter_by_trajectory_polygon/height_margin: 1.0
pointcloud_preprocessing/downsample_by_voxel_grid/enable_downsample: true
pointcloud_preprocessing/downsample_by_voxel_grid/voxel_size_x: 0.2
