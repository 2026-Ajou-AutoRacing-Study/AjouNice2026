# MORAI IONIQ5 sensor configuration used by the existing offline PointPainting pipeline.
# Vehicle/body convention: x forward, y left, z up.
# Rotations: roll, pitch, yaw in degrees.

lidar:
  frame_id: lidar1
  position: [0.855, 0.000, 1.388]
  rotation: [0.0, 0.0, 0.0]

cameras:
  front:
    topic: /sensor/camera/front/compressed
    compressed: true
    position: [1.900, 0.000, 1.200]
    rotation: [0.0, 2.0, 0.0]
    width: 1280
    height: 720
    fov: 90.0

  front_left:
    topic: /sensor/camera/front_left/compressed
    compressed: true
    position: [1.150, 0.650, 1.200]
    rotation: [0.0, 10.0, 70.0]
    width: 640
    height: 480
    fov: 130.0

  front_right:
    topic: /sensor/camera/front_right/compressed
    compressed: true
    position: [1.150, -0.650, 1.200]
    rotation: [0.0, 10.0, 290.0]
    width: 640
    height: 480
    fov: 130.0

  back:
    topic: /sensor/camera/back/compressed
    compressed: true
    position: [-0.280, 0.000, 1.150]
    rotation: [0.0, 0.0, 180.0]
    width: 1280
    height: 720
    fov: 90.0
