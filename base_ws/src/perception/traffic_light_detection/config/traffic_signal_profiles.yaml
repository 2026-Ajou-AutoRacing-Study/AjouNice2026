default_profile: simple_3color

section_labels:
  201351: A
  201365: B
  201290: C
  201326: D-2
  201397: D-1

signal_assignments:
  # Competition course A, B, C, D-2 and D-1 regulatory-element IDs.
  201351: simple_3color
  201365: simple_3color
  201290: straight_left_combined
  201326: straight_or_protected_left
  201397: ignored_right_turn

profiles:
  simple_3color:
    supported_lamps: [RED_CIRCLE, YELLOW_CIRCLE, GREEN_CIRCLE]
    valid_phases:
      - [RED_CIRCLE]
      - [YELLOW_CIRCLE]
      - [GREEN_CIRCLE]
    corrections:
      # A/B phase order is R -> G -> Y -> R; neither R+G nor R+Y ever occurs,
      # so both are false positives. Prefer the observed red, same rule as C/D-2.
      RED_CIRCLE+GREEN_CIRCLE: [RED_CIRCLE]
      RED_CIRCLE+YELLOW_CIRCLE: [RED_CIRCLE]
    fallback_phase: [RED_CIRCLE]

  straight_left_combined:
    supported_lamps: [RED_CIRCLE, YELLOW_CIRCLE, GREEN_CIRCLE, GREEN_LEFT_ARROW]
    valid_phases:
      - [RED_CIRCLE]
      - [YELLOW_CIRCLE]
      - [GREEN_CIRCLE, GREEN_LEFT_ARROW]
    corrections:
      GREEN_CIRCLE: [GREEN_CIRCLE, GREEN_LEFT_ARROW]
      GREEN_LEFT_ARROW: [GREEN_CIRCLE, GREEN_LEFT_ARROW]
      # C never has a red lamp illuminated together with either green lamp.
      # Prefer the observed red over an impossible green false positive.
      RED_CIRCLE+GREEN_CIRCLE: [RED_CIRCLE]
      RED_CIRCLE+GREEN_LEFT_ARROW: [RED_CIRCLE]
      # C phase order is R -> G+GL -> Y -> R; R+Y never occurs, so prefer red.
      RED_CIRCLE+YELLOW_CIRCLE: [RED_CIRCLE]
    fallback_phase: [RED_CIRCLE]

  straight_or_protected_left:
    supported_lamps: [RED_CIRCLE, YELLOW_CIRCLE, GREEN_CIRCLE, GREEN_LEFT_ARROW]
    # Phase identification only; departure/passthrough is decided downstream.
    #   YELLOW_CIRCLE            = end of straight green -> normalized RED
    #   RED_CIRCLE+YELLOW_CIRCLE = end of protected left -> preserve both lamps
    # A preserved R+Y is not, by itself, authorization for a new departure.
    valid_phases:
      - [RED_CIRCLE]
      - [GREEN_CIRCLE]
      - [RED_CIRCLE, GREEN_LEFT_ARROW]
      - [RED_CIRCLE, YELLOW_CIRCLE]
    corrections:
      GREEN_LEFT_ARROW: [RED_CIRCLE, GREEN_LEFT_ARROW]
      RED_CIRCLE+GREEN_CIRCLE: [RED_CIRCLE]
      GREEN_CIRCLE+GREEN_LEFT_ARROW: [GREEN_CIRCLE]
      YELLOW_CIRCLE: [RED_CIRCLE]
    # Simulation-only bounded hold; never interpret fallback red as observation.
    observation_guard:
      max_observation_gap_sec: 1.5
      max_yellow_sec: 4.0
    fallback_phase: [RED_CIRCLE]

  ignored_right_turn:
    passthrough: true
    supported_lamps: [RED_CIRCLE, YELLOW_CIRCLE, GREEN_CIRCLE, GREEN_LEFT_ARROW]
    valid_phases: []
    corrections: {}
    fallback_phase: [GREEN_CIRCLE]
