frame_id: map
planning_hz: 10.0
default_velocity_mps: 5.0
use_velocity_limit: true
extract_ahead_dist: 200.0
extract_behind_dist: 0.0
delta_yaw_threshold: 1.0472

stop_distance: 3.0
# MORAI NPCs can enter the ego corridor at the route speed.  Keep an emergency
# stop buffer in addition to the predicted collision footprint so the final
# trajectory reaches zero before the object rather than at its edge.
dynamic_stop_distance: 10.0
warning_distance: 6.0
min_stop_velocity_mps: 0.5
# At 8 m/s, 1.0 m/s^2 needs 32 m to stop and was repeatedly reported as a
# late dynamic stop in the MORAI run.  This is the emergency obstacle limit;
# ordinary path speed changes remain constrained by their upstream profiles.
max_deceleration: 4.0
reaction_time: 1.0
comfortable_deceleration: 4.0
# These must match velocity_smoother/backward.  The dynamic-stop node emits a
# zero-speed cap and the shared Autoware jerk-limited model shapes the braking
# profile before that cap.
autoware_stop:
  max_deceleration_mps2: 1.0
  max_deceleration_jerk_mps3: 1.0
object_size_margin: 0.3
dynamic_object_time_margin: 1.0
slow_dynamic_stop_speed_threshold_mps: 1.0
dynamic_stop_ttc_threshold: 4.0
dynamic_stop_min_relative_speed_mps: 1.0
# Autoware-style immediate-path collision prediction for moving objects.
# The object path is swept for the horizon; ego footprints are sampled by arc length.
dynamic_prediction_horizon_sec: 12.0
dynamic_collision_path_resolution_m: 0.5
dynamic_collision_margin_m: 0.8
# Keep the closest dynamic stop point while an object is crossing.  This
# matches Autoware Dynamic Obstacle Stop's decision-duration buffers: react
# immediately, but require 2 s of continuous non-detection before releasing.
dynamic_stop_add_duration_sec: 0.0
dynamic_stop_remove_duration_sec: 2.0
dynamic_stop_hysteresis_m: 1.0
dynamic_stop_passed_margin_m: 2.0
# True only when a detected dynamic collision is already inside the normal
# jerk-limited stopping distance. The Autoware longitudinal MORAI controller
# consumes this request as an immediate full-brake safety override.
aeb_stop_topic: /planning/motion_velocity_planner/aeb_stop
# Leave this enabled while validating MORAI dynamic-object scenarios. It logs
# the transformed object state and the selected immediate-path collision point.
dynamic_collision_debug: true
vehicle_length_m: 4.635
vehicle_width_m: 1.892
vehicle_rear_overhang_m: 0.79

slowdown_distance: 15.0
min_slow_velocity_mps: 1.0
cruise_speed_mps: 5.0
safe_distance: 10.0

min_ttc: 1.0
distance_buffer: 0.0
min_adjusted_velocity_mps: 2.5
max_lateral_distance: 1.5
dynamic_speed_threshold_mps: 0.1
stop_unknown_objects: true
min_confidence: 0.5
stop_object_labels: [car, truck, bus, bicycle, motorcycle, pedestrian]
