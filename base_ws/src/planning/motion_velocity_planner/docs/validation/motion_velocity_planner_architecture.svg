<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Motion Velocity Planner integration architecture</title>
  <desc id="desc">BPP path, odometry, objects, and velocity limit feed the motion velocity planner, which applies obstacle and TTC policies before publishing a final path and trajectory.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <style>.title{font:700 26px sans-serif;fill:#0f172a}.label{font:600 17px sans-serif;fill:#0f172a}.sub{font:14px sans-serif;fill:#475569}.box{stroke:#94a3b8;stroke-width:2;rx:14}.arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="520" fill="#f8fafc"/>
  <text x="54" y="55" class="title">Motion Velocity Planner — Integration Flow</text>
  <text x="54" y="82" class="sub">Validated ROS 1 topic path used in the end-to-end test</text>
  <g>
    <rect x="55" y="130" width="245" height="72" class="box" fill="#dbeafe"/><text x="78" y="160" class="label">Behavior Path Planner</text><text x="78" y="185" class="sub">/behavior_path_planner/output/path</text>
    <rect x="55" y="235" width="245" height="72" class="box" fill="#e0f2fe"/><text x="78" y="265" class="label">Odometry</text><text x="78" y="290" class="sub">/odometry</text>
    <rect x="55" y="340" width="245" height="72" class="box" fill="#e0f2fe"/><text x="78" y="370" class="label">Predicted Objects</text><text x="78" y="395" class="sub">/perception/objects</text>
    <rect x="370" y="115" width="440" height="315" class="box" fill="#ffffff" stroke="#2563eb"/>
    <text x="400" y="155" class="label">motion_velocity_planner</text><text x="400" y="180" class="sub">Sequential velocity-profile policies</text>
    <text x="415" y="220" class="sub">1. Base velocity / VelocityLimit</text><text x="415" y="252" class="sub">2. Obstacle stop / Dynamic obstacle stop</text><text x="415" y="284" class="sub">3. Slow down / Cruise</text><text x="415" y="316" class="sub">4. TTC velocity limiter</text>
    <rect x="895" y="175" width="245" height="72" class="box" fill="#dcfce7"/><text x="918" y="205" class="label">Final Path</text><text x="918" y="230" class="sub">/motion_velocity_planner/output/path</text>
    <rect x="895" y="295" width="245" height="72" class="box" fill="#dcfce7"/><text x="918" y="325" class="label">Trajectory</text><text x="918" y="350" class="sub">/motion_velocity_planner/output/trajectory</text>
    <path d="M300 166 H370" class="arrow"/><path d="M300 271 H345 V245 H370" class="arrow"/><path d="M300 376 H345 V315 H370" class="arrow"/><path d="M810 210 H895" class="arrow"/><path d="M810 330 H870 V331 H895" class="arrow"/>
  </g>
  <text x="55" y="480" class="sub">Note: out_of_lane and boundary_departure_prevention are currently validated as standalone nodes, not part of this integrated topic chain.</text>
</svg>
