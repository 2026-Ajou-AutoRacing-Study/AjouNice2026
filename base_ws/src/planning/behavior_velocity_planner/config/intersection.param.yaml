common:
  attention_area_length: 200.0
  attention_area_margin: 0.75
  attention_area_angle_threshold: 0.785
  default_stopline_margin: 3.0
  pass_judge_line_margin: 1.0
  max_accel: -2.8
  max_jerk: -5.0

base_link_to_front: 3.79
base_link_to_rear: 1.10
vehicle_width: 1.90
footprint_search_step: 0.10

collision_detection:
  collision_detection_hold_time: 1.0
  min_predicted_path_confidence: 0.05
  not_prioritized:
    collision_start_margin_time: 3.0
    collision_end_margin_time: 2.0
  fully_prioritized:
    collision_start_margin_time: 2.0
    collision_end_margin_time: 0.0
  velocity_profile:
    default_velocity: 2.778
    minimum_default_velocity: 1.0
  target_type:
    unknown: false
    car: true
    truck: true
    bus: true
    trailer: true
    motorcycle: true
    bicycle: true

stuck_vehicle:
  stuck_vehicle_velocity_threshold: 0.833
  stuck_vehicle_detect_dist: 5.0
  turn_direction:
    straight: true
    left: true
    right: true

yield_stuck:
  distance_threshold: 5.0
  turn_direction:
    straight: false
    left: true
    right: true

occlusion:
  enable: true
  free_space_max: 43
  occupied_min: 58
  unknown_is_occupied: false
  occlusion_detection_hold_time: 0.5
  temporal_stop_time_before_peeking: 1.0
  peeking_offset: 1.0
  creep_velocity_without_traffic_light: 1.0
