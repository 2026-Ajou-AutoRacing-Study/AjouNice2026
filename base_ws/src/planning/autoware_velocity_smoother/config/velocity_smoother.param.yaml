# /localization/kinematic_state already uses SI units (m/s).
planning_hz: 10.0
kinematic_velocity_scale_to_mps: 1.0
# The local controller can deviate more than Autoware's integrated controller.
# Re-anchor the profile to measured speed once tracking error exceeds 1.8 km/h.
replan_velocity_deviation_mps: 0.5

initial_state:
  max_previous_pose_distance_m: 5.0

# Prevent the controller's stopped-state hold from trapping a valid departure.
engage_velocity_mps: 0.8
engage_distance_m: 5.0
stop_distance_to_prohibit_engage_m: 0.5

max_velocity_mps: 11.1
min_velocity_for_time_calculation_mps: 1.0
stop_velocity_threshold_mps: 0.01

# Keep the internal jerk calculation independent of the upstream point spacing.
# The published trajectory retains the upstream point layout.
resample:
  interval_m: 0.1

forward:
  max_acceleration_mps2: 2.0
  max_jerk_mps3: 1.0

backward:
  # Normal constraints are used whenever the target is reachable comfortably.
  max_deceleration_mps2: 1.0
  max_jerk_mps3: 1.0
  # Limit constraints are only selected when the normal envelope cannot reach
  # a lower velocity target. Tune these to the vehicle/controller capability.
  limit_max_deceleration_mps2: 2.5
  limit_max_jerk_mps3: 1.5

debug:
  stop_velocity_warn_threshold_mps: 0.3

curve:
  enable_lateral_acceleration_limit: true
  max_lateral_accel_mps2: 2.0
  min_curve_velocity_mps: 10
  decel_distance_before_curve_m: 40.0
  decel_distance_after_curve_m: 4.0
  curvature_window: 3
  min_curve_radius_m: 1.0
