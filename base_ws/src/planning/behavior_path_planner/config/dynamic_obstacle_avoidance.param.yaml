common:
  enable_debug_info: false
  use_hatched_road_markings: true

target_object:
  car: true
  truck: true
  bus: true
  trailer: true
  unknown: false
  bicycle: true
  motorcycle: true
  pedestrian: true
  max_obstacle_vel: 100.0
  min_obstacle_vel: 0.0
  successive_num_to_entry_dynamic_avoidance_condition: 5
  successive_num_to_exit_dynamic_avoidance_condition: 1
  min_obj_lat_offset_to_ego_path: 0.0
  max_obj_lat_offset_to_ego_path: 1.0
  cut_in_object:
    min_time_to_start_cut_in: 1.0
    min_lon_offset_ego_to_object: 0.0
    min_object_vel: 0.5
  cut_out_object:
    max_time_from_outside_ego_path: 2.0
    min_object_lat_vel: 0.3
    min_object_vel: 0.5
  crossing_object:
    min_overtaking_object_vel: 1.0
    max_overtaking_object_angle: 1.05
    min_oncoming_object_vel: 1.0
    max_oncoming_object_angle: 0.523
    max_pedestrian_crossing_vel: 0.8
  front_object:
    max_object_angle: 0.785
    min_object_vel: -0.5
    max_ego_path_lat_cover_ratio: 0.3
  stopped_object:
    max_object_vel: 0.5

drivable_area_generation:
  expand_drivable_area: false
  polygon_generation_method: ego_path_base
  object_path_base:
    min_longitudinal_polygon_margin: 3.0
  lat_offset_from_obstacle: 1.0
  margin_distance_around_pedestrian: 2.0
  predicted_path:
    end_time_to_consider: 2.0
    threshold_confidence: 0.0
  max_lat_offset_to_avoid: 0.5
  max_time_for_object_lat_shift: 0.0
  lpf_gain_for_lat_avoid_to_offset: 0.9
  max_ego_lat_acc: 0.3
  max_ego_lat_jerk: 0.3
  delay_time_ego_shift: 1.0
  overtaking_object:
    max_time_to_collision: 40.0
    start_duration_to_avoid: 1.0
    end_duration_to_avoid: 1.0
    duration_to_hold_avoidance: 3.0
  oncoming_object:
    max_time_to_collision: 40.0
    start_duration_to_avoid: 1.0
    end_duration_to_avoid: 0.0

vehicle_width: 1.892
base_link_to_front: 3.845
base_link_to_rear: 0.790
default_bound_width: 2.5
