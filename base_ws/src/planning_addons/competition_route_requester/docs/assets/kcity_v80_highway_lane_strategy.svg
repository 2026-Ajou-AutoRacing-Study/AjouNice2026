<text x="955" y="585" class="small" text-anchor="start">
<tspan x="955" dy="0">• 200137은 200128과 나란한 상위 차선이며 누락 구간이 아니다.</tspan>
<tspan x="955" dy="29">• 병합된 200187은 중간 차선이다. 같은 위치의 최상위는 201444이다.</tspan>
<tspan x="955" dy="29">• 진입 직후 평행 후보 201456~201459 중에서</tspan>
<tspan x="955" dy="29">  SetPreferredPrimitive로 중간 차선 201457을 선택한다.</tspan>
<tspan x="955" dy="29">• 200187에서 201444로 왼쪽 LC 후 200127→201439로 합류한다.</tspan>
</text>
