# Runtime ROS1 configuration. Change the case here and restart all three nodes.
route_operation_case: route_a_only
route_definition_file: kcity_v61_competition_route.yaml
set_waypoint_route_service_name: /planning/set_waypoint_route
set_lanelet_route_service_name: /planning/set_lanelet_route
route_topic: /planning/mission_planning/route
route_state_topic: /planning/route_state
odometry_topic: /localization/kinematic_state
operation_mode_topic: /system/operation_mode/state
map_topic: /map/vector_map
trajectory_topic: /planning/trajectory
validation_topic: /planning/validation_status
reroute_availability_topic: /planning/scenario_planning/lane_driving/behavior_planning/behavior_path_planner/output/is_reroute_available
auto_request_initial_route: true
allow_runtime_case_change: false
odometry_max_age: 0.5
operation_mode_max_age: 0.5
reroute_availability_max_age: 0.5
reroute_available_hold_time: 0.5
service_timeout: 5.0
route_verification_timeout: 5.0
trajectory_verification_timeout: 60.0
trajectory_max_age: 1.0  # canonical Planning Validator latency threshold와 동일; controller freshness 0.5s는 별도다.
goal_tolerance_m: 0.5
retry_initial_interval: 2.0
retry_reroute_interval: 1.0
initial_route_max_attempts: 0
reroute_max_attempts: 0
require_new_trajectory: true
never_clear_route: true
