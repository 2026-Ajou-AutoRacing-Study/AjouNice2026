# GUI에서 저장한 개인 실험 설정입니다. 이 파일은 Git에 포함되지 않습니다.
# 이 YAML의 목적지·주행 제한시간은 선택한 모든 시나리오에 동일하게 적용됩니다.
# scenarios.include가 있으면 파일명 목록만 실행하며 glob보다 우선합니다.
# 목록 없이 패턴 실행하려면 GUI 장면 선택에서 전체 실행(패턴)을 누르세요.
# 이 파일은 재사용·수정 가능합니다. 새 실행마다 입력 사본과 결과 폴더를 따로 만듭니다.
# 재개는 GUI 실험 기록 또는 --execution 결과폴더로 진행합니다.
schema_version: 2
campaign_name: dynamic_obstacle_starter
scenarios:
  directory: base_ws/src/planning_addons/planning_scenario_validator/config/missions/dynamic_obstacle/workspace/scenarios
  glob: "*.json"
default_case:
  goal:
    x: 70.991398
    y: 585.981428
    z: 28.387175
    yaw_deg: 90.733994
  waypoints: []
  timeout_sec: 90.0
  arrival_mode: stop
stack:
  pose_source: localization
  detector: od_gt
  traffic_light: false
recording:
  topic_profile: base_ws/src/planning_addons/planning_scenario_validator/config/internal/topic_profiles/basic.json
  include_sensors: false
  video:
    enabled: true
    display: ":1"
    fps: 10
    focus_planviz: false
    window_layout: split
    bottom_bar_px: auto
  minimum_free_disk_gib: 10
network:
  sensor_json: configs/sensors/Sensor_competition_local.json
  ego_network_json: base_ws/src/planning_addons/planning_scenario_validator/config/internal/generated/ego_network_validator_local.json
morai:
  map_name: R_KR_PR_K-city_2025
  scenario_install_dir: auto
  scenario_load_host: 127.0.0.1
  scenario_load_port: 9095
output_root: planner_logs/validation
resume: true
continue_on_system_error: false
readiness_timeout_sec: 60
scenario_ready_timeout_sec: 35
route_ready_timeout_sec: 75
validation:
  goal_tolerance_m: 2.0
  goal_hold_sec: 1.0
  goal_speed_max_mps: 0.5
  topic_loss_timeout_sec: 4.0
  stuck_timeout_sec: 0.0
  localization_safety:
    enabled: true
upload:
  enabled: false
  rclone_remote: ajou_drive:planning_validator
  profile: basic
