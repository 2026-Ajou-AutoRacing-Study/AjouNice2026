# start_pos.json을 바탕으로 scenario를 생성하는 규칙이다.

paths:
  directories:
    # 같은 위치/시작 pose는 목표속도와 무관하게 하나의 정지 scenario를 공유한다.
    scenario_directory: "configs/scenario"
    # MORAI Scenario/EgoNetwork에 함께 복사할 <scenario_stem>_MN.json을 저장한다.
    scenario_network_directory: "configs/scenario/EgoNetwork"
  files:
    # 이 JSON을 그대로 복사한 뒤 Ego 시작 pose와 속도만 변경한다.
    scenario_template_json: "configs/scenario/start_pos.json"
    # F4에서 검증한 Ego/control UDP 포트를 scenario별 sidecar로 복제한다.
    scenario_network_template_json: "configs/network/ego_network_competition_local.json"

scenario_generation:
  start_pose_source: "trajectory_first_row"
  trajectory_columns:
    x: "x"
    y: "y"
    z: "z"
    yaw: "yaw"
    lanelet_id: "lanelet_id"
    velocity_mps: "velocity_mps"

  initial_speed_tolerance_kph: 0.1
  # trajectory 목표속도와 분리한다. ScenarioLoad 직후에는 정지 상태에서 controller가 가속한다.
  initial_speed_kph: 0.0
  # MORAI 저장 형식의 주행 gear. 기존 follower/UDP 설정과 동일하게 4를 사용한다.
  initial_gear: 4
  # Lanelet trajectory z에서 MORAI Ego 중심 z로 맞추는 start_pos 기준 보정값이다.
  vehicle_z_offset_m: 0.33903913816601516
  overwrite_existing: false

  speed_fields:
    - "egoVehicle.currentVelocity"
    - "egoVehicle.customValue"
    - "egoVehicle.initPosition.vehicleSaveData.velocity"
