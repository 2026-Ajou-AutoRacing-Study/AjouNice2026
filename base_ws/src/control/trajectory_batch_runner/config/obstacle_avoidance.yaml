# trajectory_batch_runner 설정 형식 버전이다.
config_version: 1

# 이 파일은 K-City의 Obstacle Avoidance trajectory 묶음을 실행하기 위한 설정이다.
experiment:
  # 기록과 화면에 표시할 시험 이름이다.
  name: "obstacle_avoidance"
  # 허용값은 lane_change 또는 obstacle_avoidance다.
  type: "obstacle_avoidance"

# 아래의 상대경로는 모두 repository_root를 기준으로 해석한다.
paths:
  # 현재 저장소의 절대경로다. 다른 PC에서는 이 값만 해당 저장소 위치로 바꾼다.
  repository_root: "/home/jihun/AjouNice2026"

  # trajectory_csv launch 인자를 package 상대경로로 만들 때 사용할 패키지 루트다.
  trajectory_package_dir: "base_ws/src/control/trajectory_generator"

  # 이 폴더 바로 아래의 모든 CSV를 파일명 순서대로 실행한다.
  # 현재 65kph 폴더는 config와 속도별 시나리오 매칭을 검증하기 위한 기본값이다.
  # 실제 장애물 회피 trajectory 폴더가 준비되면 이 값만 해당 폴더로 바꾼다.
  trajectory_dir: "base_ws/src/control/trajectory_generator/traj_sample/65kph"

  # 시작 lanelet과 시작 속도에 대응하는 MORAI 장애물 시나리오 JSON을 찾을 폴더다.
  # 현재는 기존 속도별 시작 시나리오가 있는 공용 폴더를 사용한다.
  # 실제 장애물 배치 시나리오를 별도 폴더에 만들면 이 값을 그 폴더로 바꾼다.
  scenario_dir: "configs/scenario"

  # MORAI F4에서 로드하고 udp launch의 network_config로 전달할 파일이다.
  network_json: "configs/network/ego_network_1.json"

  # MORAI F3에서 로드하고 udp launch의 sensor_config로 전달할 파일이다.
  # 현재 Sensor.json은 Sensor_5.json과 같은 최신 설정이며 GPS는 30 Hz다.
  sensor_json: "configs/sensors/Sensor.json"

  # udp launch가 MORAI 제어 명령 변환에 사용할 차량 설정이다.
  vehicle_config: "configs/vehicle/ioniq5.yaml"

  # maptf_morai_cor가 사용할 MORAI GT localization 설정이다.
  localization_manager_config: "configs/localization/localization_manager.yaml"

  # K-City runtime에서 사용할 Lanelet map과 projector다.
  lanelet_map_file: "kcity_map/lanelet_map/lanelet2_map_v45.osm"
  projector_file: "kcity_map/lanelet_map/map_projector_info_v1.yaml"

  # traj_fol_a에 전달할 controller 설정 파일들이다.
  follower_common_config: "base_ws/src/control/trajectory_follower/config/trajectory_follower_autoware.yaml"
  follower_lateral_config: "base_ws/src/control/trajectory_follower/config/purepursuit_autoware.yaml"
  follower_longitudinal_config: "base_ws/src/control/trajectory_follower/config/longi_pi_autoware.yaml"

  # traj_val이 주행 결과를 저장하는 기존 폴더다.
  validator_history_dir: "base_ws/src/control/trajectory_validator/history"

# MORAI와 ROS가 사용할 map 조건이다.
map:
  # 장애물 회피는 K-City 맵에서 실행한다.
  mode: "kcity"
  # 시나리오 JSON의 mapInfo.mapName이 이 값과 같아야 한다.
  morai_map_name: "R_KR_PR_K-city_2025"
  # ROS의 기준 좌표계다.
  frame_id: "map"

# paths.trajectory_dir에서 실행할 파일을 고르는 규칙이다.
trajectory_input:
  # CSV만 trajectory 실행 대상으로 사용한다.
  file_pattern: "*.csv"
  # 지정 폴더의 하위 폴더는 탐색하지 않는다.
  recursive: false
  # 파일명 오름차순으로 실행한다.
  order: "filename_ascending"
  # publisher와 validator 계약상 trajectory는 trajectory_package_dir 내부에 있어야 한다.
  require_inside_trajectory_package: true

# 각 CSV와 동일한 시작 속도의 시나리오를 선택하는 규칙이다.
scenario_selection:
  # 시작 lanelet은 CSV 첫 데이터 행의 lanelet_id에서 읽는다.
  start_lanelet_source: "first_row_lanelet_id"

  initial_speed:
    # 시작 목표 속도는 CSV 첫 데이터 행의 velocity_mps에서 읽는다.
    source: "first_row_velocity_mps"
    # CSV의 m/s를 시나리오 파일명과 MORAI 초기 속도의 km/h로 변환한다.
    mps_to_kph: 3.6
    # 파일명에 사용할 속도는 가장 가까운 정수 km/h로 만든다.
    rounding: "nearest_integer"
    # 변환된 속도와 정수 속도의 차이가 이 값보다 크면 잘못된 입력으로 처리한다.
    tolerance_kph: 0.1
    # 정지 시나리오 fallback 없이 같은 속도의 시나리오만 허용한다.
    require_exact_match: true

  # 예: lanelet 200275, 65 km/h -> 200275_start_65.json
  filename_pattern: "{start_lanelet}_start_{speed_kph}.json"

  validation:
    # 시나리오 mapInfo.mapName은 map.morai_map_name과 같아야 한다.
    verify_map_name: true
    # egoVehicle.currentVelocity가 계산된 speed_kph와 같아야 한다.
    current_velocity_field: "egoVehicle.currentVelocity"
    # 저장 차량 상태의 초기 속도도 계산된 speed_kph와 같아야 한다.
    saved_velocity_field: "egoVehicle.initPosition.vehicleSaveData.velocity"
    # MORAI 시나리오의 위 두 속도 필드는 km/h로 취급한다.
    scenario_velocity_unit: "kph"

# 각 run 전에 MORAI에 보낼 ScenarioLoad 요청 설정이다.
scenario_loader:
  # 현재 저장소의 MORAI NetworkModule 예제와 같은 UDP 방식을 사용한다.
  transport: "udp"
  host: "127.0.0.1"
  port: 9099
  # UDP에는 JSON 전체경로가 아니라 확장자를 제외한 파일명을 보낸다.
  filename_value: "stem"

  request:
    # Ego Network와 Sensor는 batch 시작 전에 한 번 연결하므로 시나리오에서 다시 로드하지 않는다.
    load_network_connection_data: false
    # 기존 시나리오 객체를 모두 지우는 별도 명령은 사용하지 않는다.
    delete_all: false
    # 속도별로 저장된 Ego 차량 상태를 반드시 로드한다.
    load_ego_vehicle_data: true
    # 장애물 회피 시나리오의 상대 차량이 있으면 함께 로드한다.
    load_surrounding_vehicle_data: true
    # 시나리오에 보행자가 있으면 함께 로드한다.
    load_pedestrian_data: true
    # 장애물 회피에 필요한 장애물을 반드시 로드한다.
    load_obstacle_data: true
    # follower 준비 전 차량이 움직이지 않도록 시나리오를 pause 상태로 로드한다.
    set_pause: true

# batch 시작부터 끝까지 한 번만 유지할 스택이다.
persistent_stack:
  roscore:
    # 단축어 rc에 해당한다.
    command: "roscore"

  udp:
    # 단축어 udp에 해당한다.
    package: "sensor_interface"
    launch_file: "morai_udp_interface.launch"
    arguments:
      # 각 값은 paths의 어느 키를 launch 인자로 넘길지 뜻한다.
      sensor_config: "paths.sensor_json"
      network_config: "paths.network_json"
      vehicle_config: "paths.vehicle_config"
      enable_sensors: true
      enable_lidar: true
      enable_ego_network: true
      enable_control: true

  localization:
    # 단축어 maptf_morai_cor에 해당한다.
    package: "bringup"
    launch_file: "maptf_morai_deg_correction.launch"
    arguments:
      localization_manager_config: "paths.localization_manager_config"
      ego_topic: "/Ego_topic"
      map_frame: "map"
      morai_map_frame: "morai_map"
      base_frame: "base_link"
      # 현재 maptf_morai_cor의 기본 yaw 보정값이다.
      heading_yaw_offset_deg: -1.347

# trajectory 하나마다 새로 시작하고 종료할 스택이다.
per_run_stack:
  trajectory_generator:
    # 단축어 traj_gen에 해당한다.
    package: "trajectory_generator"
    launch_file: "trajectory_publisher.launch"
    # runner가 현재 CSV의 package 상대경로를 이 launch 인자에 넣는다.
    trajectory_argument: "trajectory_csv"

  trajectory_validator:
    # traj_val의 기록 기능만 사용하며 batch에서는 RViz를 띄우지 않는다.
    package: "trajectory_validator"
    launch_file: "record.launch"

  trajectory_follower:
    # 단축어 traj_fol_a에 해당한다.
    package: "trajectory_follower"
    launch_file: "pp_pi_autoware.launch"
    arguments:
      common_config: "paths.follower_common_config"
      pp_config: "paths.follower_lateral_config"
      pi_config: "paths.follower_longitudinal_config"
      vehicle_config: "paths.vehicle_config"

# runner가 준비 상태와 실행 상태를 확인할 ROS topic이다.
topics:
  ego: "/Ego_topic"
  collision: "/CollisionData"
  kinematic_state: "/localization/kinematic_state"
  trajectory: "/control/trajectory"
  control_command: "/ctrl_cmd"

# 현재 run을 완료로 판단하는 기존 traj_val 결과 조건이다.
completion:
  metadata_status: "complete"
  end_reason: "goal_reached"
