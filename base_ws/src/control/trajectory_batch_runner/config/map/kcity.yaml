# K-City 지도 선택 규칙이다. 특정 버전 파일명을 직접 지정하지 않는다.

map:
  environment: "kcity"
  lanelet:
    directory: "kcity_map/lanelet_map"
    filename_pattern: "lanelet2_map_v*.osm"
    selection: "latest_numeric_version"

paths:
  files:
    map_projector: "kcity_map/lanelet_map/map_projector_info_v1.yaml"
    morai_static_tf_yaml: "configs/tf/morai_lanelet_static_tf.yaml"

morai:
  expected_map_name: "R_KR_PR_K-city_2025"
