topics:
  trajectory: /control/trajectory
  kinematic_state: /localization/kinematic_state
  steering_cmd: /control/command/steering
  controller_valid: /control/autoware/controller_valid
  failure_reason: /control/autoware/failure_reason
  target_point: /control/autoware/target_point
  ctrl_cmd: /ctrl_cmd

control_rate_hz: 50.0

# MORAI GT localization forwards signed base_link longitudinal velocity in km/h.
kinematic_velocity_scale_to_mps: 0.2777777777777778

control_limits:
  max_accel_cmd: 1.0
  max_brake_cmd: 1.0

safety:
  trajectory_timeout_s: 0.5
  state_timeout_s: 0.5
  steering_timeout_s: 0.5
  lateral_valid_timeout_s: 0.2
  min_points: 3
  stop_brake_cmd: 1.0
