topics:
  trajectory: /planning/trajectory
  kinematic_state: /localization/kinematic_state
  steering_cmd: /control/command/steering
  controller_valid: /control/autoware/controller_valid
  failure_reason: /control/autoware/failure_reason
  target_point: /control/autoware/target_point
  ctrl_cmd: /ctrl_cmd

control_rate_hz: 50.0

# /localization/kinematic_state already provides signed base_link velocity in m/s.
kinematic_velocity_scale_to_mps: 1.0

control_limits:
  max_accel_cmd: 1.0
  max_brake_cmd: 1.0

safety:
  trajectory_timeout_s: 0.5
  state_timeout_s: 0.5
  # Receipt-time checks alone cannot detect a cached trajectory/odometry message
  # that is repeatedly republished. Reject old, zero, or implausibly future source stamps too.
  trajectory_source_timeout_s: 10.0
  state_source_timeout_s: 0.5
  future_stamp_tolerance_s: 0.1
  steering_timeout_s: 0.5
  lateral_valid_timeout_s: 0.2
  min_points: 3
  stop_brake_cmd: 1.0
