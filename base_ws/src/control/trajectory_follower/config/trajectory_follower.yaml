topics:
  trajectory: /control/trajectory
  kinematic_state: /localization/kinematic_state
  steering_cmd: /control/command/steering
  ctrl_cmd: /ctrl_cmd

control_rate_hz: 30.0

# MORAI GT localization currently forwards /Ego_topic velocity in km/h.
# Convert that boundary input to the m/s unit used by trajectory messages and control.
kinematic_velocity_scale_to_mps: 0.2777777777777778

vehicle:
  wheelbase_m: 3.0
  max_steer_rad: 0.698

control_limits:
  max_accel_cmd: 1.0
  max_brake_cmd: 1.0

morai:
  longlCmdType: 1

safety:
  trajectory_timeout_s: 0.5
  state_timeout_s: 0.5
  steering_timeout_s: 0.5
  min_points: 2
  stop_brake_cmd: 1.0
