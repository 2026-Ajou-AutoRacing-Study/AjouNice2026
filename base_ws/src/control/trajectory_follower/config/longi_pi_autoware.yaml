# Default MORAI type-1 PI values. The lateral validity watchdog is new.
kp: 1.0
ki: 0.05
integral_limit: 3.0
command_deadband: 0.0

# Follow the nearest trajectory point by default. Enable preview explicitly when the controller
# should begin decelerating for a lower speed already present farther along the trajectory.
speed_preview:
  enabled: false
  time_s: 1.5
  min_distance_m: 5.0
  max_distance_m: 30.0

# MORAI type-1 command is normalized, not m/s^2. Calibrate hold_brake_cmd on the target vehicle.
stop:
  velocity_threshold_mps: 0.1
  hold_brake_cmd: 0.2
