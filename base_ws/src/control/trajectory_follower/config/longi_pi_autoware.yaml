# Existing MORAI type-1 PI values. The lateral validity watchdog is new.
kp: 0.8
ki: 0.05
integral_limit: 3.0
command_deadband: 0.05
# Do not let acceleration-side integral memory delay braking. Brake-side
# integral is retained across a brief positive error to avoid rapid re-acceleration.
reset_acceleration_integral_on_braking: true

brake_hysteresis:
  enabled: true
  # Enter on a real overspeed, and require a wider recovery before leaving brake mode.
  enter_error_mps: 0.08
  exit_error_mps: 0.15
  # Release for a substantial underspeed only when it persists; this rejects
  # one- or two-cycle state/target discontinuities during strong deceleration.
  hard_exit_error_mps: 0.50
  hard_exit_hold_s: 0.10
  # While the trajectory still requests at least this deceleration, retain a small brake.
  planned_deceleration_threshold_mps2: 0.50
  min_brake_cmd: 0.05

control_limits:
  # Normal trajectory tracking only. Safety/watchdog stops still publish stop_brake_cmd immediately.
  max_brake_rise_rate_per_s: 2.0
  max_brake_fall_rate_per_s: 5.0

# Distance-aware preview: retain the local plan unless a future speed restriction
# requires braking now. The horizon expands to cover the assumed stopping distance.
speed_preview:
  enabled: true
  time_s: 1.5
  min_distance_m: 5.0
  max_distance_m: 30.0
  # Keep one m/s^2 of reserve below the 7.0 m/s^2 planner emergency envelope.
  deceleration_mps2: 6.0
  response_delay_s: 0.3
  distance_margin_m: 0.2

# MORAI type-1 command is normalized, not m/s^2. Calibrate hold_brake_cmd on the target vehicle.
stop:
  velocity_threshold_mps: 0.1
  hold_brake_cmd: 0.2
