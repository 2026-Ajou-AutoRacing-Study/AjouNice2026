# Edit this file when selecting a route or changing its target speed profile.
# Empty route_selection_csv means the finite full preferred-course catalog route.
generator:
  route_id: competition_v44_preferred_once
  map_version: v44
  catalog_csv: kcity_map/competition_route/v44/drive_course_v44_lanelets.csv
  route_selection_csv: ""
  # Example short route:
  # route_selection_csv: base_ws/src/control/trajectory_generator/config/routes/v44/200889_200337.csv
  stitch_gap_m: 0.25
  resample_ds_m: 0.50
  publish_rate_hz: 1.0
  speed_profile:
    mode: constant
    constant_kph: 20.0
    default_cruise_kph: 40.0
    clamp_to_legal: false
    vehicle_max_speed_kph: 80.0
    max_lateral_accel_mps2: 1.5
    max_accel_mps2: 1.0
    max_decel_mps2: 1.5
    max_jerk_mps3: 0.8
