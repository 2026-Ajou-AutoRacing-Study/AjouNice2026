topics:
  trajectory: /control/trajectory
  kinematic_state: /localization/kinematic_state
  ego: /Ego_topic
  ctrl_cmd: /ctrl_cmd
  collision: /CollisionData
  purepursuit_debug: /purepursuit_autoware/debug/controller_state

controller:
  type: autoware_pure_pursuit
  purepursuit_parameter_namespace: /purepursuit_autoware
  longitudinal_parameter_namespace: /longi_pi_autoware

storage:
  history_dir: base_ws/src/control/trajectory_validator/history
  schema_version: 5
  overwrite: false

# traj_val shows the latest completed runs of the current trajectory sample as
# ego-path-only RViz overlays. his1 is the newest, followed by his2 and his3.
history_overlay:
  count: 3
  topic_root: /trajectory_validator/ego_path

input:
  # /localization/kinematic_state already provides velocity in m/s.
  kinematic_velocity_scale_to_mps: 1.0

recording:
  sample_rate_hz: 50.0
  input_timeout_s: 0.5
  sync_tolerance_s: 0.05
  command_pair_tolerance_s: 0.10
  # Keep recording after MORAI reports a collision.  The collision flag is still
  # stored in tracking_samples.csv and metadata.json.
  stop_on_collision: false
  goal_tolerance_m: 3.0
  # Require progress near the final station too. This prevents a closed route
  # (for example 200889 -> 200892 -> 200889) ending at its start point.
  goal_progress_margin_m: 5.0
  # Keep the endpoint checks above, but do not accept a goal until the ego has
  # physically traveled this fraction of the input trajectory's XY length.
  min_travel_ratio_for_goal: 0.70
  controller_debug_timeout_s: 0.20
