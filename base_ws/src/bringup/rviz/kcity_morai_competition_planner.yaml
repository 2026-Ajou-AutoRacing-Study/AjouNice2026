Panels:
  - Class: rviz/Displays
    Name: Displays
    Property Tree Widget:
      Expanded:
        - /Global Options1
        - /K-City v441
        - /Current Vehicle1
        - /Mission Route1
        - /Final Trajectory1
      Splitter Ratio: 0.5
    Tree Height: 690
  - Class: trajectory_validator/PlanningStatus
    Name: Planning Status
  - Class: trajectory_validator/PlannerCsvLogger
    Name: Planner CSV Logger
Visualization Manager:
  Class: ""
  Displays:
    - Alpha: 0.2
      Cell Size: 20
      Class: rviz/Grid
      Color: 84; 88; 96
      Enabled: false
      Name: Grid
      Plane: XY
      Plane Cell Count: 100
      Reference Frame: <Fixed Frame>
      Value: false
    - Class: rviz/MarkerArray
      Enabled: true
      Marker Topic: /map/lanelet_map
      Name: K-City v44
      Queue Size: 10
      Value: true
    - Class: rviz/MarkerArray
      Enabled: true
      Marker Topic: /viewer/current_vehicle_marker
      Name: Current Vehicle
      Queue Size: 10
      Value: true
    - Class: rviz/MarkerArray
      Enabled: true
      Marker Topic: /perception/morai/objects/markers
      Name: Perception Bounding Boxes
      Queue Size: 10
      Value: true
    - Class: rviz/MarkerArray
      Enabled: true
      Marker Topic: /planning/debug/behavior_velocity_planner/markers
      Name: Crosswalk Decisions
      Queue Size: 10
      Value: true
    - Class: rviz/MarkerArray
      Enabled: true
      Marker Topic: /planning/mission_planning/mission_planner/debug/route_marker
      Name: Mission Route
      Queue Size: 10
      Value: true
    - Class: rviz/MarkerArray
      Enabled: true
      Marker Topic: /planning/mission_planning/competition_route/checkpoints
      Name: Competition Route Points
      Queue Size: 10
      Value: true
    - Alpha: 0.65
      Buffer Length: 1
      Class: rviz/Path
      Color: 240; 240; 245
      Enabled: true
      Line Style: Lines
      Line Width: 0.04
      Name: Final Trajectory Path
      Offset:
        X: 0
        Y: 0
        Z: 0.5
      Pose Style: None
      Topic: /planning/debug/final_trajectory/path
      Value: true
    - Class: rviz/MarkerArray
      Enabled: true
      Marker Topic: /planning/debug/final_trajectory/markers
      Name: Final Trajectory
      Queue Size: 10
      Value: true
    - Class: rviz/MarkerArray
      Enabled: true
      Marker Topic: /planning/mission_planning/rviz/input_markers
      Name: Manual Start and Goal
      Queue Size: 10
      Value: true
  Enabled: true
  Global Options:
    Background Color: 18; 20; 24
    Fixed Frame: map
    Frame Rate: 30
  Name: root
  Tools:
    - Class: rviz/Interact
    - Class: rviz/MoveCamera
    - Class: rviz/Select
    - Class: rviz/SetInitialPose
      Topic: /initialpose
    - Class: rviz/SetGoal
      Topic: /move_base_simple/goal
    - Class: rviz/FocusCamera
    - Class: rviz/Measure
  Views:
    Current:
      Angle: 0
      Class: rviz/TopDownOrtho
      Name: K-City MORAI Planner
      Scale: 0.35
      Target Frame: base_link
      X: 0
      Y: 0
    Saved: ~
Window Geometry:
  Height: 900
  Hide Left Dock: false
  Hide Right Dock: false
  Width: 1500
  X: 20
  Y: 30
