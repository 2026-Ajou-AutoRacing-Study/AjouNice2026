## Prediction durations (seconds). Restart tracking after editing.
## Baseline maximum: rotary/general and kinematic fallback paths.
prediction_horizon: 3.0
## Highway maximum: a real map terminal can produce a shorter valid path.
highway_prediction_horizon: 10.0
highway_prediction_mode: native
## One-way highway only: recover a noisy future heading from nearby road geometry.
## Current object pose/twist remain unchanged; ordinary roads are unaffected.
highway_direction_recovery: true
## Highway only: one CURRENT-lane continuation, not confidence Top1.
## Follow an observed new lane only after the center crosses its boundary.
## false restores all original highway hypotheses; rotary/general stay unchanged.
highway_current_lane_only: true
highway_lane_switch_margin_m: 0.2
prediction_time_step: 0.1

## Vehicle-only planner-facing predictions on the shared Route A/B corridor.
## Starts after the C dynamic crossing (pedestrian at map y~534), and ends
## before the GPS-shadow objects can enter the 100m detector range.
## Enabled only by production launch args; standalone predictor defaults OFF.
vehicle_only_start_lanelet_id: 200258
vehicle_only_start_s_m: 30.0
vehicle_only_end_lanelet_id: 200088
vehicle_only_max_lateral_m: 12.0

maximum_lane_distance_m: 3.0
maximum_lane_yaw_error_rad: 0.7853981634
lane_distance_sigma_m: 0.75
lane_yaw_sigma_rad: 0.2617993878
minimum_speed_mps: 0.5
lateral_convergence_time_sec: 1.5
route_length_padding_m: 3.0
maximum_nearest_lanelets: 12
maximum_start_lanelets: 3
maximum_paths: 6
maximum_route_depth: 12
trajectory_cluster_distance_m: 0.75
