common:
  lid_topic: /sensor/lidar1
  imu_topic: /sensor/imu
  gnss_topic: /localization/gnss/fix
  wheel_topic: /unused/wheel
  use_gnss: true
  use_wheel: false
  time_sync_en: false
  time_offset_lidar_to_imu: 0.0

preprocess:
  # The competition pipeline groups the VLP-16 stream at 600 RPM = 10 Hz.
  lidar_type: 2
  scan_line: 16
  scan_rate: 10
  # velodyne_pointcloud publishes the per-point `time` field in seconds.
  timestamp_unit: 0
  blind: 2

wheel:
  extrinsic_est_wheel: false
  scale_est_wheel: false
  extrinsic_T: [0.0, 0.0, 0.0]
  extrinsic_R: [1, 0, 0,
                0, 1, 0,
                0, 0, 1]
  wheel_scale: [1.0]

mapping:
  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  fov_degree: 180
  det_range: 100.0
  extrinsic_est_en: false

  # Sensor_4 LiDAR pose in the IMU frame.
  extrinsic_T: [-0.673, 0.0, 1.188]
  extrinsic_R: [1, 0, 0,
                0, 1, 0,
                0, 0, 1]

  # Despite the upstream key name, its residual uses IMU -> GNSS.
  # Sensor_4: GPS [0,0,1.230] - IMU [1.528,0,0.200].
  extrinT_Gnss2IMU: [-1.528, 0.0, 1.030]
  extrinsic_leverarm_en: false

gnss:
  use_external_alignment: true
  use_utm_projection: true
  position_only_update: true
  initial_pose_topic: /localization/initialpose
  reference_frame: morai_map
  require_valid_status: true
  max_position_variance_m2: 200.0
  position_covariance_floor_m2: 0.25

output:
  odom_topic: /localization/odom
  camera_init_frame: camera_init
  body_frame: body

publish:
  path_en: true
  scan_publish_en: true
  dense_publish_en: true
  scan_bodyframe_pub_en: true

pcd_save:
  pcd_save_en: false
  interval: -1
