# Runtime sensor config: configs/sensors/Sensor.json
# 260801 기준 최신 원본: configs/sensors/Sensor_6.json
# GT-assisted CTRA-like measurement uncertainty for noise-disabled MORAI.
# Values are standard deviations; adapter nodes publish their squares.
# MORAI GPS is noise-free but quantized by its NMEA representation. 0.10 m is
# the replay-validated production model for that quantization; 0.05 m made the
# global EKF follow cell transitions too aggressively.
profile_name: sensor6_gt_quantization_aware_0p10
source_sensor_config: Sensor.json

imu:
  # IMU orientation is normalized but not fused by the GT CTRA EKF.
  orientation_stddev_rad: 0.001745329252
  angular_velocity_stddev_radps: 0.001
  linear_acceleration_stddev_mps2: 0.05

gnss:
  horizontal_stddev_m: 0.10
  vertical_stddev_m: 1.0

gt:
  heading_stddev_rad: 0.001745329252
  longitudinal_velocity_stddev_mps: 0.01

# Production Global-only nonholonomic prior, not a measured Competition vy.
# Launch arguments are authoritative, including for custom noise profiles.
lateral_model:
  enabled: true
  stddev_mps: 0.20
  topic: /localization/constraints/lateral_velocity
