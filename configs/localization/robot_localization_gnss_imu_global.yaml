# Globally corrected branch. This node alone owns map -> odom.
frequency: 50
predict_to_current_time: true
sensor_timeout: 0.2
two_d_mode: true
transform_time_offset: 0.0
# The local EKF publishes odom -> base_link independently. Use its latest
# available sample instead of blocking every global filter cycle.
transform_timeout: 0.0
print_diagnostics: true
# map -> odom intentionally falls back to the latest local EKF transform.
silent_tf_failure: true
debug: false
publish_tf: true
publish_acceleration: false

map_frame: map
odom_frame: odom
base_link_frame: base_link
world_frame: map

imu0: /localization/imu
imu0_config: [false, false, false,
              false, false, true,
              false, false, false,
              false, false, true,
              true,  true,  false]
imu0_queue_size: 100
imu0_nodelay: true
imu0_differential: false
imu0_relative: false
imu0_remove_gravitational_acceleration: true

odom0: /localization/gnss/odom
odom0_config: [true,  true,  false,
               false, false, false,
               false, false, false,
               false, false, false,
               false, false, false]
odom0_queue_size: 100
odom0_nodelay: true
odom0_differential: false
odom0_relative: false

