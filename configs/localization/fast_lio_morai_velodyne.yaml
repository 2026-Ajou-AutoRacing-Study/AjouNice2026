common:
  lid_topic: "/sensor/lidar1"
  imu_topic: "/sensor/imu"
  time_sync_en: false
  time_offset_lidar_to_imu: 0.0

preprocess:
  # 1: Livox, 2: Velodyne, 3: Ouster, 4: MARSIM
  lidar_type: 2

  # MORAI LiDAR model is being treated as HDL32-like.
  scan_line: 32

  # MORAI sensor period is 0.1s, so target rate is 10Hz.
  scan_rate: 10

  # This must match the unit of the PointCloud2 "time" field.
  # FAST-LIO default Velodyne config uses 2 = microsecond.
  # Keep this for the first test, but verify /sensor/lidar1/fields first.
  timestamp_unit: 2

  # Ignore points closer than this distance.
  blind: 2

mapping:
  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001

  fov_degree: 180
  det_range: 100.0

  # We are giving initial LiDAR-IMU extrinsic manually.
  extrinsic_est_en: false

  # LiDAR pose in IMU frame.
  # LiDAR: [3.55, 0.0, 1.40]
  # IMU:   [1.2, 0.0, 0.50]
  # LiDAR - IMU = [2.35, 0.0, 0.90]
  extrinsic_T: [2.35, 0.0, 0.90]

  # Keep rotation identity until the 10 deg LiDAR pitch is validated in FAST-LIO.
  extrinsic_R: [1, 0, 0,
                0, 1, 0,
                0, 0, 1]

publish:
  path_en: true
  scan_publish_en: true
  dense_publish_en: true
  scan_bodyframe_pub_en: true

pcd_save:
  pcd_save_en: false
  interval: -1
