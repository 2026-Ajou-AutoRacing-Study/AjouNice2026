frames:
  map: map
  morai_map: morai_map
  camera_init: camera_init
  body: body
  base_link: base_link

topics:
  ego: /Ego_topic
  competition: /Competition_topic
  gps: /sensor/gps
  gnss_fix: /localization/gnss/fix
  gt_orientation: /localization/gt/orientation
  gt_twist: /localization/gt/twist
  initial_pose: /localization/initialpose
  fast_lio_odom: /localization/odom
  kinematic_state: /localization/kinematic_state

providers:
  fast_lio:
    initialization:
      # Ego is used only once to align camera_init with the global map.
      source: ego
      max_time_difference_sec: 0.05
      heading_unit: degrees
  fast_lio_gnss:
    initialization:
      # First development stage: competition start pose is represented by Ego GT.
      source: ego
      max_time_difference_sec: 0.05
      heading_unit: degrees
      manual:
        frame_id: morai_map
        position: [0.0, 0.0, 0.0]
        rpy_degrees: [0.0, 0.0, 0.0]
    gnss:
      # Temporary measurement model until the official noise range is known.
      horizontal_stddev_m: 0.5
      vertical_stddev_m: 1.0
      reject_duplicate_stamps: true
      require_valid_status: true
      max_position_variance_m2: 200.0
  gnss_imu:
    initialization:
      # Only the initial position uses Ego in MR development. The CTRA launch
      # selects its initial heading from the same status source as motion.
      source: ego  # ego | official_start | manual
      heading_unit: degrees
      max_pose_heading_stamp_delta_sec: 0.2
      max_official_gnss_heading_stamp_delta_sec: 0.5
      max_official_start_distance_m: 3.0
      # Diagnostic warning only; preserve the selected measured heading.
      max_official_yaw_error_deg: 1.0
      position_stddev_m: 0.1
      yaw_stddev_rad: 0.017453292519943295
      manual:
        frame_id: morai_map
        position: [0.0, 0.0, 0.0]
        rpy_degrees: [0.0, 0.0, 0.0]
  gnss_imu_gt:
    # Use ego for existing bags. Switch explicitly to competition for the event.
    source: ego  # ego | competition
    heading_unit: degrees
    reject_duplicate_stamps: true
    # MORAI sample scenario yaw=62.515 deg while the stationary Ego heading at
    # the exact start pose is 63.862 deg. Disable this if the simulator is fixed.
    use_heading_correction: true
    heading_yaw_offset_deg: -1.347

runtime:
  tf_lookup_timeout_sec: 0.05
  morai_gt_retry_period_sec: 0.01
