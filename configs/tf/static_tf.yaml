# rpy is stored as roll, pitch, yaw in radians.
# The ROS launch publisher uses yaw, pitch, roll order; keep that conversion explicit there.
static_transforms:
  - parent: "base_link"
    child: "lidar1"
    xyz: [2.05, 0.0, 1.373]
    rpy: [0.0, 0.0, 0.0]

  - parent: "base_link"
    child: "lidar2"
    xyz: [0.35, 0.0, 1.576]
    rpy: [0.0, 0.0872665, 3.14159]

  - parent: "base_link"
    child: "sensor/imu"
    xyz: [1.528, 0.0, 1.23]
    rpy: [0.0, 0.0, 0.0]

  - parent: "base_link"
    child: "gps"
    xyz: [0.0, 0.0, 1.23]
    rpy: [0.0, 0.0, 0.0]
