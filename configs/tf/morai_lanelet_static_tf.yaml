# Static alignment between the Autoware/Lanelet map frame and MORAI k-city MGeo.
#
# parent -> child follows tf2_ros/static_transform_publisher semantics:
#   point_in_parent = R_parent_child * point_in_child + translation_parent_child
#
# map:
#   Lanelet2 LocalCartesianUTM frame from kcity_map/lanelet_map/map_projector_info_v1.yaml
# morai_map:
#   MORAI k-city MGeo local frame from the current live simulator account.
#
# The transform uses the difference between the Lanelet projector origin and
# the current MORAI MGeo origin. lanelet2_map_v61 centerlines are stored in the
# current MGeo/GIS source coordinates, so no empirical rigid refinement is
# applied.
map_to_morai_map:
  parent: "map"
  child: "morai_map"
  xyz: [131.559130220, 545.911338186, 0.0]
  rpy: [0.0, 0.0, 0.0]

  source:
    morai_scene: "k-city competition runtime"
    morai_mgeo_global_coordinate_system: "+proj=utm +zone=52 +ellps=WGS84 +units=m +no_defs"
    morai_runtime_gps_east_north_offset: [302595.0, 4124145.0]
    morai_runtime_origin_delta_xyz: [131.559130220, 545.911338186, 0.0]
    morai_runtime_z_is_altitude_like: true

    lanelet_map: "kcity_map/lanelet_map/lanelet2_map_v61.osm"
    lanelet_projector: "kcity_map/lanelet_map/map_projector_info_v1.yaml"
    lanelet_projector_type: "LocalCartesianUTM"
    lanelet_map_origin_lat_lon_alt: [37.2380038082, 126.7730819386, 0.0]
    lanelet_map_origin_utm52: [302463.440869780, 4123599.088661814, 0.0]

    alignment_refinement:
      method: "none; v61 uses current MGeo/GIS source coordinates"
      yaw_rad: 0.0
      yaw_deg: 0.0
      translation_delta_from_runtime_origin_m: [0.0, 0.0, 0.0]
      applied_for: "lanelet2_map_v61 source-coordinate alignment"
