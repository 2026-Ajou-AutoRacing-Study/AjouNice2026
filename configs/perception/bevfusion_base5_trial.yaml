# Opt-in Base5 trial. E25's runtime file/default launch is unchanged.
operation: inference
server_host: 127.0.0.1
server_port: 29515
connect_timeout_sec: 2.0
request_timeout_sec: 30.0
camera_order: [camera_front, camera_front_left, camera_front_right, camera_back]
camera_buffer_size: 30
sync_tolerance_sec: 0.05
latest_frame_only: true
drop_incomplete_frame: true
preprocess_workers: 4
# Decode/crop in the same Docker OpenCV environment as offline evaluation.
# Native JPEG bytes are passed without recompression; E25 keeps host RGB8.
image_encoding: compressed
image_final_height: 512
image_final_width: 1056
image_resize: 0.825
image_reference_width: 1280
intrinsic_source: horizontal_fov
lidar_deskew_mode: off
temporal_sweeps: 0
temporal_feature_cache: false
query_memory_context: false
publish_detector_velocity: false
# Bridge sends RAW 0..255 intensity. Start the Base5 server with
# --base5-runtime --point-intensity-source ros255 to normalize exactly once.
point_feature_contract: xyzi
point_intensity_source: ros255
score_threshold: 0.10
max_detections: 100
marker_lifetime_sec: 0.50
