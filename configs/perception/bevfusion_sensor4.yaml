# Runtime policy only; all sensor geometry and topics come from Sensor_5.json.
operation: inference

server_host: 127.0.0.1
server_port: 29500
connect_timeout_sec: 2.0
request_timeout_sec: 30.0

camera_order:
  - camera_front
  - camera_front_left
  - camera_front_right
  - camera_back
camera_buffer_size: 20
sync_tolerance_sec: 0.10
latest_frame_only: true
drop_incomplete_frame: true

intrinsic_source: horizontal_fov
score_threshold: 0.20
max_detections: 100
marker_lifetime_sec: 0.50

