# Runtime policy only; geometry/topics come from the selected canonical Sensor JSON.
# Current local input: configs/sensors/Sensor_competition_local.json.
operation: inference

server_host: 127.0.0.1
server_port: 29500
connect_timeout_sec: 2.0
request_timeout_sec: 30.0

camera_order:
  - camera_front
  - camera_front_left
  - camera_front_right
  - camera_back
camera_buffer_size: 30
sync_tolerance_sec: 0.10
latest_frame_only: true
drop_incomplete_frame: true

# The model still receives exactly [x, y, z, intensity]. When explicitly
# enabled, the bridge consumes MORAI's point `time` only to correct XYZ into
# one scan-end LiDAR frame before inference. E25 remains raw/off by default.
point_feature_contract: xyzi
preprocess_workers: 4
lidar_deskew_mode: off
lidar_deskew_reference: end
lidar_deskew_pose_topic: /localization/kinematic_state
lidar_deskew_pose_type: odometry
lidar_deskew_max_point_time_span_sec: 0.15
lidar_deskew_maximum_extrapolation_sec: 0.05

intrinsic_source: horizontal_fov
score_threshold: 0.20
max_detections: 100
marker_lifetime_sec: 0.50
