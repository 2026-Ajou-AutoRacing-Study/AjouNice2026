# Runtime policy only; all sensor geometry and topics come from Sensor.json.
# 260729 기준 Sensor.json의 최신 원본은 configs/sensors/Sensor_6.json이다.
operation: inference

server_host: 127.0.0.1
server_port: 29500
connect_timeout_sec: 2.0
request_timeout_sec: 30.0

camera_order:
  - camera_front
  - camera_front_left
  - camera_front_right
  - camera_back
camera_buffer_size: 30
sync_tolerance_sec: 0.10
latest_frame_only: true
drop_incomplete_frame: true

# Base3 is trained on exactly [x, y, z, intensity]. The ROS bridge enforces
# this contract and intentionally drops MORAI's optional per-point time field.
point_feature_contract: xyzi
preprocess_workers: 4

intrinsic_source: horizontal_fov
score_threshold: 0.20
max_detections: 100
marker_lifetime_sec: 0.50
