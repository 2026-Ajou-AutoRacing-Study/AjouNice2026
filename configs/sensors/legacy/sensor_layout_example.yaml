# 예시임.
frames:
  map: "map"
  odom: "odom"
  base_link: "base_link"

lidars:
  lidar1:
    frame_id: "lidar1"
    topic: "/sensor/lidar1"
    model: "HDL32"
  lidar2:
    frame_id: "lidar2"
    topic: "/sensor/lidar2"
    model: "HDL32"

imu:
  frame_id: "imu"
  topic: "/sensor/imu"
  target_rate_hz: 500

gnss:
  frame_id: "gnss_link"
  topic: "/sensor/gps"

cameras:
  front:
    topic: "/sensor/camera"
    type: "sensor_msgs/CompressedImage"
    frame_id: "camera_front"
    transport: "udp_morai_jpeg"
    udp_destination_port: 1232
    fov_deg: 55
