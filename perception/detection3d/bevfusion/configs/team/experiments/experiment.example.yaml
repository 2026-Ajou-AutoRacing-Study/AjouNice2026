version: 1
name: fresh-e12
mode: fresh
epochs: 12
learning_rate: 1.0e-4
base_config: perception/detection3d/bevfusion/configs/bevfusion_base3_b0_4cam_lidar.py

dataset:
  # Empty values mean BASE3_CAPTURE_ROOT / BASE3_INFO_ROOT from
  # .env.bevfusion.local. container_root must match the absolute prefix stored
  # in the MMDetection3D PKL files.
  capture_root: ""
  info_root: ""
  container_root: /datasets/base3

gpu:
  profile: auto
  physical_batch_size: auto
  gradient_accumulation: auto
  workers: auto
  shm_size: auto

wandb:
  enabled: true
  entity: AjouNice2026
  project: morai-3d-object-detection
  group: bevfusion-base3-team
  tags: [base3, four-camera, lidar, fresh]

output:
  # Empty means BEVFUSION_OUTPUT_ROOT from .env.bevfusion.local.
  root: ""

checkpointing:
  # Keep this small for ordinary trials; retain every epoch for long sweeps.
  interval: 1
  max_keep_ckpts: 3
