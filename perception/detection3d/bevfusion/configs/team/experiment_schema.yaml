version: 1
required:
  - name
  - mode
allowed:
  name: string
  mode: [fresh, finetune, resume, random]
  epochs: positive_integer
  learning_rate: positive_number
  checkpoint: path_or_empty
  base_config: repository_relative_python_config
  dataset:
    info_root: path_or_empty
  gpu:
    profile: [auto, rtx2080ti, rtx3090, rtx4090, rtx5060ti]
    physical_batch_size: positive_integer_or_auto
    gradient_accumulation: positive_integer_or_auto
    workers: nonnegative_integer_or_auto
    shm_size: docker_size_or_auto
  wandb:
    enabled: boolean
    entity: string
    project: string
    group: string
    tags: list_of_strings
  output:
    root: path_or_empty
  checkpointing:
    interval: positive_integer
    max_keep_ckpts: positive_integer
