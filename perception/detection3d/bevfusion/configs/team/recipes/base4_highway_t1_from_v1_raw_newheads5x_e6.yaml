version: 1
name: base4-highway-t1-from-v1-raw-newheads5x-e6
mode: finetune
epochs: 6
learning_rate: 2.0e-5
checkpoint: ${BEVFUSION_BASE4_V1_TO_T1_CHECKPOINT}
base_config: perception/detection3d/bevfusion/configs/bevfusion_base4_t1_4cam_lidar_3sweep_velocity_w1_head5x.py

dataset:
  capture_root: ${BASE4_HIGHWAY_FIRST_EXP_RAW_ROOT}
  info_root: ${BASE4_HIGHWAY_FIRST_EXP_RAW_ROOT}
  container_root: /datasets/base4_highway_first_experiment_v1_raw

schedule:
  warmup_optimizer_updates: 75
  validation_interval: 2

gpu:
  profile: auto
  physical_batch_size: auto
  gradient_accumulation: auto
  workers: auto
  shm_size: auto

wandb:
  enabled: true
  entity: AjouNice2026
  project: morai-3d-object-detection
  group: bevfusion-base4-highway-lr-ablation
  tags: [base4, highway, velocity, velocity-weight-1, v1-warm-start, velocity-head-lr-5x, time-input-lr-5x, three-sweep, raw-scan]

output:
  root: ""

checkpointing:
  interval: 2
  max_keep_ckpts: 4
