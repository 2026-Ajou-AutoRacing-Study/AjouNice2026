version: 1
name: base4-highway-t1-raw-overfit64-velw5-head5x-e60
mode: finetune
epochs: 60
learning_rate: 1.0e-4
checkpoint: ${BEVFUSION_BASE4_T1_INIT_CHECKPOINT}
base_config: perception/detection3d/bevfusion/configs/bevfusion_base4_t1_4cam_lidar_3sweep_velocity_w5_head5x.py

dataset:
  capture_root: ${BASE4_HIGHWAY_FIRST_EXP_RAW_ROOT}
  info_root: ${BASE4_HIGHWAY_FIRST_EXP_RAW_ROOT}
  container_root: /datasets/base4_highway_first_experiment_v1_raw
  overfit_samples: 64

schedule:
  warmup_optimizer_updates: 10
  validation_interval: 10

gpu:
  profile: auto
  physical_batch_size: auto
  gradient_accumulation: auto
  workers: auto
  shm_size: auto

wandb:
  enabled: true
  entity: AjouNice2026
  project: morai-3d-object-detection
  group: bevfusion-base4-velocity-learnability
  tags: [base4, highway, velocity, velocity-weight-5, head-lr-5x, temporal-input-lr-5x, three-sweep, exact-sample-overfit]

output:
  root: ""

checkpointing:
  interval: 10
  max_keep_ckpts: 6
