version: 1
name: base4-highway-t1-continue-e6-newheads5x-e4
mode: finetune
epochs: 4
learning_rate: 1.0e-5
checkpoint: ${BEVFUSION_BASE4_T1_E6_CHECKPOINT}
base_config: perception/detection3d/bevfusion/configs/bevfusion_base4_t1_4cam_lidar_3sweep_velocity_w1_head5x.py

dataset:
  capture_root: ${BASE4_HIGHWAY_FIRST_EXP_RAW_ROOT}
  info_root: ${BASE4_HIGHWAY_FIRST_EXP_RAW_ROOT}
  container_root: /datasets/base4_highway_first_experiment_v1_raw

schedule:
  warmup_optimizer_updates: 25
  validation_interval: 1

gpu:
  profile: auto
  physical_batch_size: auto
  gradient_accumulation: auto
  workers: auto
  shm_size: auto

wandb:
  enabled: true
  entity: AjouNice2026
  project: morai-3d-object-detection
  group: bevfusion-base4-highway-lr-ablation
  tags: [base4, highway, velocity, t1-e6-continuation, velocity-head-lr-5x, time-input-lr-5x, three-sweep, raw-scan]

output:
  root: ""

checkpointing:
  interval: 1
  max_keep_ckpts: 4
