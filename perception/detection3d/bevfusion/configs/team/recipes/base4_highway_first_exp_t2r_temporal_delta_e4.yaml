version: 1
name: base4-highway-first-exp-t2r-temporal-delta-e4
mode: finetune
epochs: 4
learning_rate: 2.0e-5
checkpoint: ${BEVFUSION_BASE4_V1_TO_T1_CHECKPOINT}
base_config: perception/detection3d/bevfusion/configs/bevfusion_base4_t2r_4cam_lidar_temporal_bev_velocity.py

dataset:
  capture_root: ${BASE4_HIGHWAY_FIRST_EXP_RAW_ROOT}
  info_root: ${BASE4_HIGHWAY_FIRST_EXP_RAW_ROOT}
  container_root: /datasets/base4_highway_first_experiment_v1_raw

schedule:
  warmup_optimizer_updates: 75
  validation_interval: 1

gpu:
  profile: auto
  physical_batch_size: auto
  gradient_accumulation: auto
  workers: auto
  shm_size: auto

wandb:
  enabled: true
  entity: AjouNice2026
  project: morai-3d-object-detection
  group: bevfusion-base4-temporal-architecture
  tags: [base4, highway, velocity, temporal-bev, ordered-delta, residual]

output:
  root: ""

checkpointing:
  interval: 1
  max_keep_ckpts: 4
