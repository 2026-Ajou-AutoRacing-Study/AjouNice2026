version: 1
name: base4-highway-t1-raw-overfit64-velw1-e40
mode: finetune
epochs: 40
learning_rate: 2.0e-5
checkpoint: ${BEVFUSION_BASE4_T1_INIT_CHECKPOINT}
base_config: perception/detection3d/bevfusion/configs/bevfusion_base4_t1_4cam_lidar_3sweep_velocity_w1.py

dataset:
  capture_root: ${BASE4_HIGHWAY_FIRST_EXP_RAW_ROOT}
  info_root: ${BASE4_HIGHWAY_FIRST_EXP_RAW_ROOT}
  container_root: /datasets/base4_highway_first_experiment_v1_raw
  overfit_samples: 64

schedule:
  warmup_optimizer_updates: 10
  validation_interval: 5

gpu:
  profile: auto
  physical_batch_size: auto
  gradient_accumulation: auto
  workers: auto
  shm_size: auto

wandb:
  enabled: true
  entity: AjouNice2026
  project: morai-3d-object-detection
  group: bevfusion-base4-velocity-learnability
  tags: [base4, highway, velocity, velocity-weight-1, three-sweep, raw-scan, overfit-diagnostic]

output:
  root: ""

checkpointing:
  interval: 5
  max_keep_ckpts: 8
