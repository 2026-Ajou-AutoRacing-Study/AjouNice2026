version: 1
name: base4-highway-v1-raw-overfit64-velw1-lr1e4-e20
mode: finetune
epochs: 20
learning_rate: 1.0e-4
checkpoint: ${BEVFUSION_BASE3_E25_FINETUNE_CHECKPOINT}
base_config: perception/detection3d/bevfusion/configs/bevfusion_base4_v1_4cam_lidar_velocity_w1.py

dataset:
  capture_root: ${BASE4_HIGHWAY_FIRST_EXP_RAW_ROOT}
  info_root: ${BASE4_HIGHWAY_FIRST_EXP_RAW_ROOT}
  container_root: /datasets/base4_highway_first_experiment_v1_raw
  overfit_samples: 64

schedule:
  warmup_optimizer_updates: 10
  validation_interval: 5

gpu:
  profile: auto
  physical_batch_size: auto
  gradient_accumulation: auto
  workers: auto
  shm_size: auto

wandb:
  enabled: true
  entity: AjouNice2026
  project: morai-3d-object-detection
  group: bevfusion-base4-velocity-learnability
  tags: [base4, highway, velocity, velocity-weight-1, lr-1e-4, single-frame, raw-scan, overfit-diagnostic]

output:
  root: ""

checkpointing:
  interval: 5
  max_keep_ckpts: 5
