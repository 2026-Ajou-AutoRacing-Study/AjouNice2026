version: 1
name: base4-q1-p2-postdecoder-motion-gate90-hardcase-v2-w1-head5x-e4
mode: finetune
epochs: 4
learning_rate: 1.0e-4
checkpoint: ${BEVFUSION_BASE3_E25_FINETUNE_CHECKPOINT}
base_config: perception/detection3d/bevfusion/configs/bevfusion_base4_q1_p2_postdecoder_motion_gate90_4cam_lidar_velocity.py

dataset:
  capture_root: ${BASE4_VELOCITY_HARDCASE_V2_ROOT}
  info_root: ${BASE4_VELOCITY_HARDCASE_V2_ROOT}
  container_root: /datasets/base4_velocity_hardcase_v2_raw16

gpu:
  profile: auto
  physical_batch_size: 1
  gradient_accumulation: 4
  workers: 2
  shm_size: auto

schedule:
  warmup_optimizer_updates: 100
  validation_interval: 1

wandb:
  enabled: true
  entity: AjouNice2026
  project: morai-3d-object-detection
  group: bevfusion-base4-q1-hardcase-v2-ab
  tags: [base4, highway, velocity, q1-p2c, postdecoder-motion, gate90, motion-value, temporal-velocity-aux, hardcase-v2, scene-disjoint, velocity-weight-1, head-lr-5x]

output:
  root: ""

checkpointing:
  interval: 1
  max_keep_ckpts: 4
