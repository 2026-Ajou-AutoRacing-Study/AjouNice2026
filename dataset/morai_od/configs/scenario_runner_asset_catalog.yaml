# MORAI Scenario Runner v1.7.0의 R_KR_PG_KATRI XOSC 예제 53개에서 추출했다.
# MORAI 전체 Asset 목록이 아니며, 대회/개인용 런처에서 실제 로드 검증이 필요하다.
schema_version: 1
source:
  product: MORAI Scenario Runner
  version: v1.7.0
  example_map: R_KR_PG_KATRI
  extracted_date: "2026-08-06"

vehicles:
  - model_name: 2014_Kia_K7
    dataset_role: npc_vehicle
  - model_name: 2015_Kia_K5
    dataset_role: npc_vehicle
  - model_name: 2016_Hyundai_Genesis_DH
    dataset_role: npc_vehicle
  - model_name: 2016_Hyundai_Ioniq
    dataset_role: ego_or_npc_vehicle
  - model_name: 2017_Kia_Niro(HEV)
    dataset_role: npc_vehicle
  - model_name: 2021_Hyundai_G80
    dataset_role: npc_vehicle
  - model_name: 2023_Hyundai_Ioniq5
    dataset_role: ego_or_npc_vehicle

pedestrians:
  - model_name: Boy1
    dataset_role: pedestrian
  - model_name: Man1
    dataset_role: pedestrian
  - model_name: police1
    dataset_role: pedestrian

obstacles:
  - model_name: CargoBox
    dataset_role: obstacle
  - model_name: WoodBox
    dataset_role: obstacle
  - model_name: YellowBarrel
    dataset_role: obstacle

scenario_helpers:
  # 위치·정지 지점을 표현하는 예제용 helper이며 OD 학습 객체로 사용하지 않는다.
  - model_name: StopPoint
    dataset_role: helper
  - model_name: Stop_Point
    dataset_role: helper
  - model_name: point
    dataset_role: helper

excluded_parameter_references:
  # '$'로 시작하는 값은 실제 모델명이 아니라 XOSC ParameterDeclaration 참조다.
  - $Ioniq_1
  - $Ioniq_2
  - $npc1_vehicle
  - $npc2_vehicle
  - $StopPoint_name

internal_scenario_template_ids:
  # XOSC의 문자열 model_name과 MORAI Internal Scenario JSON의 DataID는
  # 서로 다른 식별 체계다. 아래 값은 대회 샘플 JSON에서 관찰한 값이다.
  ego_vehicle:
    - 20200012
  npc_vehicle:
    - 30100004
    - 30100005
    - 30100010
    - 30100014
    - 30200003
    - 30300002
    - 30400004
    - 30700003
  pedestrian:
    - 50100001
  obstacle:
    - 40100001

usage_policy:
  require_runtime_load_validation: true
  require_xosc_name_to_internal_data_id_mapping: true
  use_helpers_as_training_objects: false
  preserve_exact_case_and_punctuation: true
  split_by_scene_before_train_val_test: true
